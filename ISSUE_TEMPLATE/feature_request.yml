name: Feature request
description: Suggest an idea or improvement for BrewPHP.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        BrewPHP aims to stay small and readable, with zero runtime dependencies in the core.
        Please check the roadmap and existing issues before suggesting a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work? Code examples of the API you imagine are very welcome.
      render: php
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or how Django or other frameworks handle this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Routing and views
        - Requests and responses
        - Middleware
        - ORM and database
        - Migrations
        - Templates
        - Forms
        - Auth, sessions and security
        - Admin
        - CLI (manage.php)
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
